# Comprueba cada día que el servidor MCP desplegado llega a la wiki de
# SinergiaTIC (tools docs_*). Si no llega, el job falla y GitHub manda un
# correo a quien tenga activadas las notificaciones de Actions del repo.
#
# La URL se puede cambiar con la variable de repositorio MCP_PUBLIC_URL
# (Settings → Secrets and variables → Actions → Variables).

name: Documentación (wiki SinergiaTIC)

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  docs-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar /api/docs-health
        env:
          BASE_URL: ${{ vars.MCP_PUBLIC_URL || 'https://mcp-sinergia.vercel.app' }}
        run: |
          url="${BASE_URL%/}/api/docs-health"
          echo "Comprobando $url"
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 --retry 2 --retry-delay 20 "$url" || echo 000)
          cat body.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error title=La documentación no está disponible::El servidor MCP no llega a la wiki de SinergiaTIC (HTTP $status). Las tools docs_* fallarán hasta que se resuelva. Detalle arriba."
            exit 1
          fi
          echo "OK: la wiki responde desde el servidor MCP."
